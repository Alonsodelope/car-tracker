name: M2 & C63 S Sync (every 48h)

# Only syncs bmw-m2 and mercedes-c63s-w206 (the /bragi link), every 48 hours,
# per the user's request — the other 4 tracked vehicles are intentionally
# left frozen at their current data and are not touched by this workflow.
# (A full sync of every vehicle is still available on demand from the
# Admin page's "Run Sync Now" button.)

on:
  schedule:
    # Every other day at 14:00 UTC (10:00 AM Eastern). Cron has no native
    # "every 48 hours" — day-of-month step is the standard approximation.
    - cron: "0 14 */2 * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI
    inputs:
      vehicle_keys:
        description: "Space-separated vehicle keys to sync (default: bmw-m2 mercedes-c63s-w206)"
        required: false
        default: "bmw-m2 mercedes-c63s-w206"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run sync (bmw-m2, mercedes-c63s-w206 only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_SECRET_TOKEN: ${{ secrets.SYNC_SECRET_TOKEN }}
        run: pnpm sync -- ${{ github.event.inputs.vehicle_keys || 'bmw-m2 mercedes-c63s-w206' }}

      - name: Notify on failure
        if: failure()
        run: echo "Sync failed. Check the logs above."
